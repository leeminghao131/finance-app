name: Bootstrap finance lockfile (one-time, safety branch only)

on:
  push:
    branches:
      - safety/guardrails-2026-11-08
    paths:
      - .github/workflows/finance-bootstrap-lock.yml

permissions:
  contents: write

jobs:
  make-lockfile:
    if: github.repository == 'leeminghao131/finance-app' && github.ref == 'refs/heads/safety/guardrails-2026-11-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this safety branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Generate lockfile using pinned versions (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit only package-lock.json
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "safety/guardrails-2026-11-08"
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "safety: commit verified lockfile from pinned dependencies"
            git push origin HEAD:refs/heads/safety/guardrails-2026-11-08
          else
            echo "Lockfile already unchanged"
          fi

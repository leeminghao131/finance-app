name: Finance Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "safety/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Finance safety / locked build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24 (matching Vercel)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify lockfile exists
        run: test -f package-lock.json
      - name: Reproducible install without lifecycle scripts
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Finance logic and safety regression tests (synthetic data only)
        run: npm test
      - name: Production build (no deployment)
        run: npm run build

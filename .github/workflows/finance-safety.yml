name: Finance Safety Checks

on:
  pull_request:
    branches: [main, safety/guardrails-2026-11-08, feature/finance-reliability-2026-11-08, feature/finance-transfer-budget-forecast-time-2026-11-08, feature/finance-safe-import-complete-export-refactor-2026-11-08, feature/finance-amount-popup-ui-2026-11-08]
  push:
    branches:
      - "safety/**"
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Finance safety / locked build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24 (matching Vercel)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify lockfile exists
        run: test -f package-lock.json
      - name: Reproducible install without lifecycle scripts
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Finance logic and safety regression tests (synthetic data only)
        run: npm test
      - name: Production build (no deployment)
        run: npm run build
      - name: Audit production dependencies (report advisories; block critical)
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > npm-audit-report.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('npm-audit-report.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) {
            console.error('Dependency security audit did not return usable results');
            process.exit(1);
          }
          const counts = report.metadata.vulnerabilities;
          console.log('Dependency audit counts:', JSON.stringify(counts));
          for (const [name, vuln] of Object.entries(report.vulnerabilities || {})) {
            if (vuln.severity === 'high' || vuln.severity === 'critical')
              console.log('Vulnerability requires review:', name, vuln.severity, 'Fix available:', JSON.stringify(vuln.fixAvailable));
          }
          if (Number(counts.high || 0) > 0 || Number(counts.critical || 0) > 0) {
            console.error('High or critical production dependency advisories block merging');
            process.exit(1);
          }
          NODE

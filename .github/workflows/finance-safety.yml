name: Finance Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "safety/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9ad8 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runtime
        run: node --version && npm --version
      - name: Baseline safety tests (no live database access)
        run: node --test tests/finance-safety.test.mjs
      - name: Install dependencies for build (no secrets passed)
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build Vite application
        run: npm run build

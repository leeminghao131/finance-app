name: MH Finance encrypted backup isolated restore rehearsal

on:
  push:
    branches:
      - backup/secure-prod-2026-11-26
    paths:
      - .github/workflows/mh-finance-verify-encrypted-restore.yml

permissions:
  contents: read
  actions: read

jobs:
  restore:
    name: Verify saved encrypted backup in disposable local PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mh-finance-prod-backup
    steps:
      - name: Download exactly the existing encrypted backup artifact
        uses: actions/download-artifact@v4
        with:
          name: mh-finance-prod-aes256-encrypted-backup
          run-id: 45831886534
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mh-finance-restore-input

      - name: Decrypt backup and verify archive checksums privately
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.MH_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/mh-finance-isolated-restore"
          mkdir -m 700 -p "$work"
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/mh-finance-restore-input/*.gpg)
          if [[ ${#archives[@]} -ne 1 || -z "${GPG_PASSPHRASE:-}" ]]; then
            echo '::error::Expected exactly one encrypted archive and a protected encryption secret.'
            exit 1
          fi
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --output "$work/bundle.tar.gz" --decrypt "${archives[0]}"
          WORK="$work" python3 - <<'PY'
          import os, tarfile
          path = os.path.join(os.environ["WORK"], "bundle.tar.gz")
          expected = {'roles.sql','schema.sql','data.sql','manifest.sha256','metadata.txt'}
          with tarfile.open(path,'r:gz') as t:
              members=t.getmembers()
              if {m.name for m in members} != expected:
                  raise SystemExit('Archive contents do not match the five expected files.')
              if any(not m.isfile() or m.size > 50_000_000 for m in members):
                  raise SystemExit('Unsafe archive member type or size.')
              t.extractall(os.environ['WORK'],filter='data')
          PY
          cd "$work"
          sha256sum -c manifest.sha256 >/dev/null
          grep -Fqx 'source_project=hlkciowyusbhwcwjzfsr' metadata.txt
          grep -Fqx 'restoration_status=NOT_YET_VERIFIED' metadata.txt
          for file in roles.sql schema.sql data.sql; do
            test -s "$file"
          done
          echo '::notice::Encrypted backup decrypts and SQL checksums match. No transaction rows printed.'
          rm -f "$work/bundle.tar.gz"

      - name: Install Supabase CLI for disposable local database only
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Create isolated local PostgreSQL 17 (no remote database URL)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mh-finance-rehearsal-project"
          cd "$RUNNER_TEMP/mh-finance-rehearsal-project"
          supabase init --force >/dev/null 2>&1
          # Supabase CLI 3.4+ defaults to config.jsonc; convert the LOCAL disposable project only.
          if [[ -f supabase/config.jsonc && ! -f supabase/config.toml ]]; then
            SUPABASE_YES=1 supabase config convert --to toml --yes >/dev/null 2>&1
          fi
          test -f supabase/config.toml || { echo '::error::Local CLI configuration not created.'; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('supabase/config.toml')
          txt=f.read_text()
          if re.search(r'(?m)^[ \t]*major_version[ \t]*=[ \t]*\d+',txt):
              txt=re.sub(r'(?m)^([ \t]*major_version[ \t]*=[ \t]*)\d+',r'\g<1>17',txt,count=1)
          elif '[db]\n' in txt:
              txt=txt.replace('[db]\n','[db]\nmajor_version = 17\n',1)
          else:
              raise SystemExit('No recognized Supabase db config; refusing restore.')
          f.write_text(txt)
          PY
          if ! supabase db start > "$RUNNER_TEMP/mh-finance-local-db-start.log" 2>&1; then
            echo '::error::Could not start disposable local Supabase DB. Production untouched.'
            exit 1
          fi
          mapfile -t dbids < <(docker ps --filter 'name=supabase_db_' --format '{{.ID}}')
          if [[ ${#dbids[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one disposable local Postgres container.'
            exit 1
          fi
          echo "LOCAL_RESTORE_DB_CONTAINER=${dbids[0]}" >> "$GITHUB_ENV"
          echo '::notice::Disposable local PostgreSQL 17 prepared; no shared Supabase project was contacted.'

      - name: Transactional roles, schema and data restore (local container only)
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mh-finance-isolated-restore"
          container="$LOCAL_RESTORE_DB_CONTAINER"
          cd "$work"
          # Use local loopback inside isolated Postgres Docker. This does not use any production DB connection.
          if ! docker exec -e PGPASSWORD=postgres "$container" \
            psql -h localhost -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT 1' \
              > /dev/null 2>&1; then
            echo '::error::Disposable local PostgreSQL did not accept its own development credentials; no remote DB touched.'
            exit 1
          fi
          # Read-only privilege boolean checks for the disposable local database.
          for restore_role in postgres supabase_admin; do
            probe=$(docker exec -e PGPASSWORD=postgres "$container" \
              psql -h localhost -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 \
              -c "SELECT rolsuper::text || ',' || rolcreaterole::text FROM pg_roles WHERE rolname = '$restore_role'" 2>/dev/null || true)
            if [[ "$probe" =~ ^(true|false|t|f),(true|false|t|f)$ ]]; then
              echo "::notice::Local role ${restore_role} privilege flags: $probe"
            else
              echo "::notice::Local role ${restore_role} privilege flags unavailable."
            fi
          done
          # Original checksum-verified roles.sql is not altered.
          # Official Supabase recovery guidance allows this exact CLI-only grant exception.
          cp "$work/roles.sql" "$work/roles_restore.sql"
          grant_regex='^[[:space:]]*GRANT "?postgres"? TO "?cli_login_postgres"? WITH INHERIT FALSE GRANTED BY "?supabase_admin"?;[[:space:]]*$'
          grant_count=$(grep -Ec "$grant_regex" "$work/roles_restore.sql" || true)
          if [[ "$grant_count" -gt 1 ]]; then
            echo '::error::Multiple matching CLI-only grants; refusing local adjustment.'
            exit 1
          fi
          if [[ "$grant_count" -eq 1 ]]; then
            sed -i -E "/$grant_regex/s/^/-- LOCAL-RESTORE-ONLY: /" "$work/roles_restore.sql"
            echo '::notice::Skipped one documented CLI login grant in disposable copy, never in original backup.'
          fi
          docker cp "$work/roles_restore.sql" "$container:/tmp/mh-restore-roles.sql" >/dev/null
          for file in schema.sql data.sql; do
            docker cp "$work/$file" "$container:/tmp/mh-restore-$file" >/dev/null
          done
          if docker exec -e PGPASSWORD=postgres "$container" \
            psql -h localhost -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -1 \
              -f /tmp/mh-restore-roles.sql -f /tmp/mh-restore-schema.sql \
              -c 'SET session_replication_role = replica' -f /tmp/mh-restore-data.sql \
              > "$work/private-restore.log" 2>&1; then
            echo '::notice::All three SQL files restored transactionally to isolated local Postgres.'
          else
            echo '::error::Local SQL restore failed. Raw errors remain private.'
            sqlstate=$(grep -Eom1 '(ERROR|FATAL):[[:space:]]*[A-Z0-9]{5}' "$work/private-restore.log" | grep -Eo '[A-Z0-9]{5}' | tail -1) || true
            if [[ "$sqlstate" =~ ^[A-Z0-9]{5}$ ]]; then
              echo "::notice::SQLSTATE (code only, no private values): $sqlstate"
            fi
            if grep -Fq 'mh-restore-roles.sql:' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure stage: roles'
            elif grep -Fq 'mh-restore-schema.sql:' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure stage: schema'
            elif grep -Fq 'mh-restore-data.sql:' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure stage: data'
            else
              echo '::notice::Sanitized failure stage: initial connection or command'
            fi
            if grep -Fq 'already exists' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure category: duplicate object'
            elif grep -Fq 'does not exist' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure category: missing object'
            elif grep -Fq 'permission denied' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure category: permissions'
            elif grep -Fq 'must be member' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure category: role membership'
            elif grep -Fq 'unrecognized configuration' "$work/private-restore.log"; then
              echo '::notice::Sanitized failure category: server version setting'
            else
              echo '::notice::Sanitized failure category: other'
            fi
            # Safe SQL error classification; never print source SQL or raw error.
            python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path("private-restore.log").read_text(errors="replace")
          match=re.search(r'psql:/tmp/mh-restore-roles\.sql:(\d+):\s*(?:ERROR|FATAL):',log)
          if match:
              index=int(match.group(1))
              sql=Path("roles_restore.sql").read_text(errors="replace").splitlines()
              window=sql[max(0,index-25):min(len(sql),index)]
              candidate=sql[index-1].strip() if 0<index<=len(sql) else ''
              start=next((line.strip() for line in reversed(window) if re.match(r'(?i)^(CREATE|ALTER|GRANT|REVOKE|COMMENT|SET|RESET|DO|SELECT|REASSIGN|DROP)\b',line.strip())),'')
              directive=re.match(r'(?i)^([A-Z]+)', start or candidate)
              opcode=(directive.group(1).upper() if directive else 'UNKNOWN')
              allowed={'CREATE','ALTER','GRANT','REVOKE','COMMENT','SET','RESET','DO','SELECT','REASSIGN','DROP'}
              if opcode not in allowed: opcode='UNKNOWN'
              print(f'::notice::Private SQL diagnostics: roles line {index}, opcode {opcode}.')
              print('::notice::Mentions Supabase CLI login grant: '+str('cli_login_postgres' in (start+candidate)))
          else:
              print('::notice::Private SQL diagnostics: no recognized role statement line.')
          PY
            exit 1
          fi

      - name: Assert restored accounts, all ledger rows, RLS and account separation
        shell: bash
        run: |
          set -euo pipefail
          container="$LOCAL_RESTORE_DB_CONTAINER"
          result=$(docker exec "$container" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres -c "
            SELECT
              (SELECT count(*) FROM public.records),
              (SELECT count(*) FROM public.transfers),
              (SELECT count(*) FROM public.user_settings),
              (SELECT count(*) FROM auth.users),
              (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('records','transfers','user_settings') AND c.relrowsecurity),
              (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename IN ('records','transfers','user_settings')),
              (SELECT count(*) FROM public.records r WHERE r.user_id IS NULL OR NOT EXISTS (SELECT 1 FROM auth.users u WHERE u.id=r.user_id)),
              (SELECT count(*) FROM public.transfers t WHERE NOT EXISTS (SELECT 1 FROM auth.users u WHERE u.id=t.user_id)),
              (SELECT count(*) FROM public.records r WHERE r.amount IS NULL OR r.amount<=0);
          " | tr -d '[:space:]')
          IFS='|' read -r records transfers settings accounts rls policies ownerless orphan_transfers bad_amounts <<< "$result"
          if [[ "$records" != "687" || "$transfers" != "58" || "$settings" != "2" || "$accounts" != "2" ]]; then
            echo '::error::Restore row counts differ from backup-time expected counts.'
            exit 1
          fi
          if [[ "$rls" != "3" || "$policies" -lt 9 || "$ownerless" != "0" || "$orphan_transfers" != "0" || "$bad_amounts" != "0" ]]; then
            echo '::error::RLS/ownership/amount integrity check failed in isolated restore.'
            exit 1
          fi
          no_owner=$(docker exec "$container" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "SET ROLE authenticated; SELECT count(*) FROM public.records;" | tail -1 | tr -d '[:space:]')
          if [[ "$no_owner" != "0" ]]; then
            echo '::error::No-JWT authenticated role can see private ledgers.'
            exit 1
          fi
          echo '::notice::Isolated restore passed counts, auth records, RLS, ownership and no-owner isolation, with no individual rows logged.'
          echo '::notice::This does not verify external Auth/email settings, live sessions or Android/Windows sign-in.'

      - name: Cleanup disposable unencrypted data
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mh-finance-isolated-restore" "$RUNNER_TEMP/mh-finance-restore-input"
          if [[ -n "${LOCAL_RESTORE_DB_CONTAINER:-}" ]]; then
            docker rm -f "$LOCAL_RESTORE_DB_CONTAINER" >/dev/null 2>&1 || true
          fi
          echo '::notice::Temporary plaintext and local container cleanup attempted; no restored database artifact uploaded.'

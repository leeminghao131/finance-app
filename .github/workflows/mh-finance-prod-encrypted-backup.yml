name: MH Finance encrypted production backup (manual setup)

on:
  push:
    branches:
      - backup/secure-prod-2026-11-26
    paths:
      - .github/workflows/mh-finance-prod-encrypted-backup.yml

permissions:
  contents: read

jobs:
  backup:
    name: Read-only dump and AES-256 encrypted handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mh-finance-prod-backup
    steps:
      - name: Verify owner approval and safely build an encoded session-pooler URL
        id: guard
        shell: bash
        env:
          DB_URL_TEMPLATE: ${{ secrets.MH_PROD_DB_URL }}
          DB_PASSWORD: ${{ secrets.MH_PROD_DB_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MH_BACKUP_PASSPHRASE }}
          BACKUP_ARMED: ${{ vars.MH_BACKUP_ARMED }}
        run: |
          set -euo pipefail
          if [[ "$BACKUP_ARMED" != "YES" ]]; then
            echo '::error::Backup not armed. No connection attempted.'
            exit 1
          fi
          if [[ -z "$DB_URL_TEMPLATE" || -z "$DB_PASSWORD" || -z "$GPG_PASSPHRASE" ]]; then
            echo '::error::Missing database connection template, separate password or encryption password. No connection attempted.'
            exit 1
          fi
          python3 - <<'PY'
          import os, re
          from urllib.parse import quote, urlsplit
          ref = 'hlkciowyusbhwcwjzfsr'
          template = os.environ['DB_URL_TEMPLATE'].strip()
          password = os.environ['DB_PASSWORD']
          encryption_password = os.environ['GPG_PASSPHRASE']
          host = 'aws-1-ap-southeast-1.pooler.supabase.com'
          if len(encryption_password) < 32:
              raise SystemExit('Encryption passphrase too short; no backup attempted.')
          # Accept a placeholder or an already populated password in the OLD template;
          # discard that password completely, rather than trying to parse unsafe brackets/@.
          pattern = (r'postgres(?:ql)?://postgres\.' + re.escape(ref) +
                     r':.*@' + re.escape(host) + r':5432/postgres(?:\?sslmode=require)?')
          if re.fullmatch(pattern, template) is None:
              raise SystemExit('Template is not the approved Production Session pooler URL; STOP.')
          safe_url = (f'postgresql://postgres.{ref}:' + quote(password, safe='') +
                      f'@{host}:5432/postgres?sslmode=require')
          check = urlsplit(safe_url)
          if check.hostname != host or check.port != 5432:
              raise SystemExit('Prepared URL does not point at approved host; STOP.')
          # Mask both the encoded password and its entire assembled URL in Actions logs.
          print(f'::add-mask::{quote(password, safe="")}')
          print(f'::add-mask::{safe_url}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'SAFE_PROD_DB_URL={safe_url}\n')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Install Supabase CLI for logical exports
        if: steps.guard.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Read-only database dump, encrypt and verify encrypted archive
        if: steps.guard.outputs.ready == 'true'
        id: dump
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.MH_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          work_dir=$(mktemp -d "$RUNNER_TEMP/mh-finance-prod-XXXXXXXX")
          trap 'rm -rf "$work_dir"' EXIT
          cd "$work_dir"
          echo 'Exporting production roles, schema, and data to runner temporary storage (no database writes).'
          supabase db dump --db-url "$SAFE_PROD_DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$SAFE_PROD_DB_URL" -f schema.sql
          supabase db dump --db-url "$SAFE_PROD_DB_URL" -f data.sql --data-only --use-copy -x 'storage.buckets_vectors' -x 'storage.vector_indexes'
          for file in roles.sql schema.sql data.sql; do
            test -s "$file" || { echo "::error::$file missing or empty. No artifact will be published."; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          sql = Path('data.sql').read_text('utf-8')
          for schema, table in [('public','records'),('public','transfers'),('public','user_settings'),('auth','users')]:
              pattern = rf'(?m)^COPY\s+(?:"?{schema}"?\.)"?{table}"?\s*\('
              if re.search(pattern, sql) is None:
                  raise SystemExit(f'Expected {schema}.{table} data section missing; refusing backup artifact.')
          PY
          sha256sum roles.sql schema.sql data.sql > manifest.sha256
          printf 'source_project=hlkciowyusbhwcwjzfsr\ncreated_utc=%s\nmethod=supabase-cli-roles-schema-data\nrestoration_status=NOT_YET_VERIFIED\n' "$(date -u +%FT%TZ)" > metadata.txt
          tar -czf plaintext.tar.gz roles.sql schema.sql data.sql manifest.sha256 metadata.txt
          output="$RUNNER_TEMP/mh-finance-production-$(date -u +%Y%m%dT%H%M%SZ).tar.gz.gpg"
          printf %s "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-mode 3 \
            --output "$output" plaintext.tar.gz
          test -s "$output"
          printf %s "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt "$output" | tar -tzf - >/dev/null
          echo "archive=$output" >> "$GITHUB_OUTPUT"
          echo '::notice::Encrypted backup generated and decrypted archive listing verified. It is NOT a full restore test.'

      - name: Upload only encrypted artifact (temporary, download within 24 hours)
        if: steps.dump.outputs.archive != ''
        uses: actions/upload-artifact@v4
        with:
          name: mh-finance-prod-aes256-encrypted-backup
          path: ${{ steps.dump.outputs.archive }}
          retention-days: 1
          if-no-files-found: error

# Backup run explicitly requested by owner after scoped environment secrets and MH_BACKUP_ARMED=YES were configured (2026-11-26 MYT).

name: Bootstrap fixed xlsx dependency lock (temporary)

on:
  push:
    branches:
      - safety/guardrails-2026-11-08
    paths:
      - .github/workflows/finance-fix-xlsx-lock.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.repository == 'leeminghao131/finance-app' && github.ref == 'refs/heads/safety/guardrails-2026-11-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Regenerate lock from the package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exactly locked packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fixed SheetJS version and synthetic Excel export
        run: |
          node --input-type=module <<'NODE'
          import * as XLSX from 'xlsx';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('node_modules/xlsx/package.json', 'utf8'));
          assert.equal(pkg.version, '0.20.3');
          const ws = XLSX.utils.aoa_to_sheet([['Date', 'Type', 'Category', 'Method', 'Amount', 'Note'], [new Date(2026, 10, 8), 'expense', 'Food', 'CASH', 17.65, 'synthetic fixture']], {cellDates:true});
          ws['!autofilter'] = { ref: 'A1:F2' };
          ws['!cols'] = [{wch:14}, {wch:12}, {wch:16}, {wch:18}, {wch:12}, {wch:40}];
          ws.A2.z = 'yyyy-mm-dd';
          ws.E2.z = '#,##0.00';
          const book=XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(book,ws,'Finance Records');
          const data=XLSX.write(book,{bookType:'xlsx',type:'buffer'});
          assert.ok(data.length>100);
          const again=XLSX.read(data,{type:'buffer',cellDates:true});
          const s=again.Sheets['Finance Records'];
          assert.equal(s.A1.v, 'Date');
          assert.equal(s.E2.v, 17.65);
          assert.equal(s.B2.v, 'expense');
          assert.equal(s.F2.v, 'synthetic fixture');
          assert.equal(s['!autofilter'].ref,'A1:F2');
          console.log('SheetJS',pkg.version,'Excel export roundtrip verified',data.length,'bytes');
          NODE
      - name: Run existing regression tests
        run: npm test
      - name: Test Vite build
        run: npm run build
      - name: Commit only package-lock
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "safety/guardrails-2026-11-08"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: lock fixed SheetJS 0.20.3"
            git push origin HEAD:refs/heads/safety/guardrails-2026-11-08
          fi
